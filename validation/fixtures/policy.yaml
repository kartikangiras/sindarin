# Test policy (design v5 §6): the management team of the adversarial tests. Ids are fixtures.
version: 3

groups:
  cfo: ["@switch-user-john:test"]
  controllers: ["@switch-user-leonardo:test"]
  board: ["@switch-user-isaac:test"]
  # Vincent (sales) is in no group

proposers:
  analyst: "@switch-agent-analyst:test"
  planner: "@switch-agent-planner:test"
  bookkeeper: "@switch-agent-bookkeeper:test"
  treasury: "@switch-agent-treasury:test"
  sales: "@switch-agent-sales:test"

executors:
  sindarin-switch: "@switch-agent-sindarin-switch:test"
  sindarin-ledger: "@switch-agent-sindarin-ledger:test"

rooms:
  finance: "!room-acme-finance:test"
  planning: "!room-planning:test"
  payments: "!room-payments:test"
  sales: "!room-sales:test"

rules:
  - name: goals
    kind: goals
    proposer: planner
    approvers: cfo
    also_invite: controllers
    room: finance
    currency: USD
    pending_ttl: 24h
  - name: budget
    kind: budget
    proposer: planner
    approvers: board
    approvers_under_limit: cfo
    limit_cents: 1000000
    room: planning
    currency: USD
    pending_ttl: 24h
  - name: entries
    kind: entries
    proposer: bookkeeper
    approvers: controllers
    room: period
    currency: USD
    pending_ttl: 24h
  - name: close
    kind: close
    proposer: bookkeeper
    approvers: controllers
    also_invite: cfo
    room: finance
    currency: USD
    pending_ttl: 24h
  - name: pay
    kind: pay
    proposer: treasury
    approvers: cfo
    approvers_under_limit: controllers
    limit_cents: 1000000
    room: payments
    currency: USD
    pending_ttl: 24h
  - name: lock
    kind: lock
    proposer: bookkeeper
    approvers: controllers
    room: period
    currency: USD
    pending_ttl: 24h
  - name: deal
    kind: deal
    proposer: sales
    approvers: cfo
    approvers_under_limit: controllers
    limit_cents: 100000
    room: sales
    currency: USD
    pending_ttl: 24h
