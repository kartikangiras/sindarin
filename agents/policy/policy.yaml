# Sindarin policy (design v5 §6). Agents draft from it; both executors enforce it.
# Every id is a Switch participant id; nothing in this file is a display name.
# `sindarin bootstrap` writes the ids and room ids. Learn yours with "@sindarin-switch whoami".
version: 3

groups:
  cfo: ["@switch-mattermost-b76af5d9-670f-4573-9f7b-6655cdb00753-user:localhost"]            # User
  controllers: ["@switch-mattermost-b76af5d9-670f-4573-9f7b-6655cdb00753-user:localhost"]            # User
  board: ["@switch-mattermost-b76af5d9-670f-4573-9f7b-6655cdb00753-user:localhost"]            # User

proposers:
  analyst: "@switch-agent-cc9230bb:localhost"
  planner: "@switch-agent-339ae16b:localhost"
  bookkeeper: "@switch-agent-9648f6fe:localhost"
  treasury: "@switch-agent-f8ca89d0:localhost"
  sales: "@switch-agent-b0b973e0:localhost"

executors:
  sindarin-switch: "@switch-agent-99c39840:localhost"
  sindarin-ledger: "@switch-agent-fe792a08:localhost"

rooms:
  finance: "02e11ed7-ac78-4028-b561-d00c7a23573a"
  planning: "cf304b00-a572-49af-bfa7-7aea2bafbb5c"
  payments: "f81d0c64-3455-4632-abc9-a69a5adcd8c0"
  sales: "9b8a8295-c309-41c8-8bec-4ad9ff4d3408"

rules:
  - name: goals
    kind: goals
    proposer: planner
    approvers: cfo
    also_invite: controllers  # sit in the plan room too
    room: finance
    currency: USD
    pending_ttl: 24h
  - name: budget
    kind: budget
    proposer: planner
    approvers: board
    approvers_under_limit: cfo
    limit_cents: 1000000      # 10,000.00 USD: up to it the cfo approves alone
    room: planning
    currency: USD
    pending_ttl: 24h
  - name: entries
    kind: entries
    proposer: bookkeeper
    approvers: controllers
    room: period             # the plan room the goals opened
    currency: USD
    pending_ttl: 24h
  - name: close
    kind: close
    proposer: bookkeeper
    approvers: controllers
    also_invite: cfo          # sits in the period room too
    room: finance
    currency: USD
    pending_ttl: 24h
  - name: pay
    kind: pay
    proposer: treasury
    approvers: cfo
    approvers_under_limit: controllers
    limit_cents: 1000000      # 10,000.00 USD: below it a controller may approve
    room: payments
    currency: USD
    pending_ttl: 24h
  - name: lock
    kind: lock
    proposer: bookkeeper
    approvers: controllers
    room: period             # the period room the plan opened
    currency: USD
    pending_ttl: 24h
  - name: deal
    kind: deal
    proposer: sales
    approvers: cfo
    approvers_under_limit: controllers
    limit_cents: 100000       # a 1,000.00 USD discount: below it a controller may approve
    room: sales
    currency: USD
    pending_ttl: 24h
