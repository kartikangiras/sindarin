const reduceMotion = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function scrollTo(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" });
}

/* ---------- primitives ---------- */

function FadeInUp({ children, className = "", delay = 0 }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    if (reduceMotion() || !("IntersectionObserver" in window)) { setShown(true); return; }
    const el = ref.current;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } });
    }, { threshold: 0.1 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <div ref={ref} style={{ transitionDelay: `${delay}ms` }}
      className={`transition-all duration-1000 ease-out ${shown ? "opacity-100 translate-y-0" : "opacity-0 translate-y-10"} ${className}`}>
      {children}
    </div>
  );
}

function Video({ sources, className = "" }) {
  return (
    <video autoPlay muted loop playsInline preload="metadata" aria-hidden="true" className={className}>
      {sources.map((s) => <source key={s} src={s} type="video/mp4" />)}
    </video>
  );
}

      {children}
    </a>

}

function SecondaryButton({ href, onClick, children }) {
  return (
    <a href={href} onClick={onClick} target={href && href.startsWith("http") ? "_blank" : undefined} rel="noopener"
      className="inline-flex items-center justify-center bg-[#1F1F22] hover:bg-[#2A2A2D] text-white text-sm font-medium px-5 py-2.5 rounded-full border border-white/5 transition-colors">
      {children}
    </a>
  );
}

function CopyButton({ text, label = "Copy" }) {
  const [state, setState] = useState("idle");
  function copy() {
    const done = (ok) => { setState(ok ? "done" : "fail"); setTimeout(() => setState("idle"), 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => done(false));
    } else done(false);
  }
  return (
    <button onClick={copy} className={`text-xs font-medium px-2.5 py-1 rounded-md border transition-colors ${state === "done" ? "border-emerald-400/40 text-emerald-300" : "border-white/10 text-gray-400 hover:text-white hover:border-white/30"}`}>
      {state === "done" ? "Copied" : state === "fail" ? "Select it" : label}
    </button>
  );
}

/* ---------- nav ---------- */

const NAV = [
  ["about", "About"],
  ["map", "Map"],
  ["workflows", "Workflows"],
  ["agents", "Agents"],
  ["commands", "Commands"],
  ["switch", "Switch"],
  ["faq", "FAQ"],
  ["contact", "Contact"],
];

function Nav() {
  const [scrolled, setScrolled] = useState(false);
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 20);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  const go = (id) => (e) => { e.preventDefault(); setOpen(false); scrollTo(id); };
  return (
    <header className={`fixed top-0 inset-x-0 z-50 transition-colors duration-300 ${scrolled || open ? "bg-black/80 backdrop-blur-md border-b border-white/5" : "bg-transparent"}`}
      style={{ paddingTop: "env(safe-area-inset-top, 0px)" }}>
      <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
        <a href="#about" onClick={go("about")} className="flex items-center gap-2.5 text-white">
          <Logo />
          <span className="font-semibold tracking-tight">Sindarin</span>
          <span className="text-gray-600 text-sm px-1">×</span>
          <SwitchLogo className="h-4 w-auto text-gray-300" />
        </a>
        <nav className="hidden md:flex items-center gap-8">
          {NAV.map(([id, label]) => (
            <a key={id} href={`#${id}`} onClick={go(id)} className="text-sm font-medium text-gray-300 hover:text-white transition-colors">{label}</a>
          ))}

function ProjectMap() {
  const ref = useRef(null);
  const [state, setState] = useState("loading");
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!window.renderSindarinMap || !window.ForceGraph3D) { setState("failed"); return; }
    try {
      const handle = window.renderSindarinMap(el, { autoRotate: true, height: el.clientHeight || 560 });
      setState(handle ? "ready" : "failed");
      return () => handle && handle.stop && handle.stop();
    } catch (e) { setState("failed"); }
  }, []);
  const legend = window.SINDARIN_MAP_LEGEND || [];
  return (
    <section id="map" className="py-24 px-6 max-w-7xl mx-auto">
      <FadeInUp className="max-w-3xl mb-10">
        <div className="mb-6"><Badge color="text-sky-300">✨ The whole thing on one map</Badge></div>
        <h2 className="text-4xl md:text-5xl font-semibold tracking-tight mb-5">Three chains, seven gates, two executors, one <span className="font-serif italic font-normal">record.</span></h2>
        <p className="text-gray-400 text-lg">People ask, agents draft, named groups approve in named rooms, deterministic executors move the books, and everything hangs off Switch. Drag to turn it, scroll to zoom, hover a node to see its neighbours and what it does.</p>
      </FadeInUp>
      <FadeInUp>
        <div className="relative rounded-3xl border border-white/10 bg-[#050506] overflow-hidden">
          <div ref={ref} className="w-full h-[480px] md:h-[600px]" />
          {state === "failed" && (
            <div className="absolute inset-0 flex items-center justify-center text-sm text-gray-400 px-6 text-center">The 3D map needs WebGL. The README carries a recorded clip of it.</div>
          )}
          <div className="absolute left-4 bottom-4 grid gap-1.5 text-xs text-gray-400 bg-black/60 border border-white/10 rounded-xl px-3 py-2.5 pointer-events-none">
            {legend.map(([label, color]) => (
              <span key={label} className="inline-flex items-center gap-2"><i className="inline-block w-2.5 h-2.5 rounded-full" style={{ background: color }} />{label}</span>
            ))}
          </div>
        </div>
        <p className="text-xs text-gray-500 mt-3">Solid arrows are the flow of a chain: sky for the plan, amber for the close, green for the deals, grey for the record. Dashed lines say who approves a gate, and the checks that run on every approve. Thin lines tie everything to Switch.</p>
      </FadeInUp>
    </section>
  );
}

/* one command, token by token: mentions by executor, verbs, ids, amounts, flags, env keys */
const MENTION = { "@sindarin-switch": "text-sky-300", "@sindarin-ledger": "text-violet-300" };
const VERBS = /^(approve|deny|changes|status|whoami|help|board|brief|sale|price|load|read|report|export|chart|audit|plan|close|deal)$/;
function Cmd({ text }) {
  if (text.startsWith("#")) return <span className="text-gray-500">{text}</span>;
  const parts = text.split(/(\s+)/);
  const chat = parts[0].startsWith("@");
  return (
    <span className="font-mono">
      {parts.map((t, i) => {
        if (/^\s+$/.test(t)) return t;
        const env = t.match(/^([A-Z][A-Z0-9_]*)=(.*)$/);
        if (env) return <span key={i}><span className="text-emerald-300">{env[1]}</span><span className="text-gray-500">=</span><span className="text-gray-200">{env[2]}</span></span>;
        let cls = "text-gray-200";
        if (t.startsWith("@")) cls = MENTION[t] || "text-amber-300";
        else if (/^(GOALS|BUDGET|ENTRIES|CLOSE|PAY|LOCK|DEAL)-\d+$/.test(t)) cls = "text-pink-300";
        else if (/^\d[\d,]*(\.\d+)?$/.test(t)) cls = "text-yellow-200";
        else if (/^<.*>$/.test(t)) cls = "text-gray-400 italic";
        else if (t.startsWith("--")) cls = "text-sky-300";
        else if (t.startsWith("#")) cls = "text-violet-200";
        else if (chat && VERBS.test(t)) cls = "text-white font-semibold";
        else if (!chat && i === 0) cls = "text-white";
        return <span key={i} className={cls}>{t}</span>;
      })}
    </span>
  );
}

function CmdRows({ rows, lead }) {
  return (
    <div className="rounded-2xl border border-white/10 bg-black/60 divide-y divide-white/5 overflow-hidden">
      {rows.map(([a, b, c], i) => (
        <div key={i} className={`grid gap-x-6 gap-y-1 px-5 py-3 text-sm ${lead ? "md:grid-cols-[9rem_minmax(0,1fr)_minmax(0,1.1fr)]" : "md:grid-cols-[minmax(0,1fr)_minmax(0,1.1fr)]"}`}>
          {lead && <span className="font-mono text-xs text-gray-500 pt-0.5">{a}</span>}
          <span className="min-w-0 break-words"><Cmd text={lead ? b : a} /></span>
          <span className={`leading-relaxed ${(lead ? c : b).startsWith("Refused") ? "text-red-300" : (lead ? c : b).includes("the books move") ? "text-amber-200" : "text-gray-400"}`}>{lead ? c : b}</span>
        </div>
      ))}
    </div>
  );
}
