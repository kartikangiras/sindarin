# Sindarin on Switch Console (design v5): the three agents as Console-run agents with the same
# instructions as agents/<role>/AGENT.md, the two rooms, and the two pre-registered executors.
# Apply from Switch Console → Templates. The executors must already exist: run
# `uv run sindarin bootstrap` (or register them by hand) before applying. The plan rooms are
# opened by sindarin-switch, not by this template.
version: 1
params:
  team:
    type: string
    description: Prefix for room names
    pattern: '[a-z][a-z0-9-]*'
    default: sindarin
  switch_executor:
    type: agent
    description: sindarin-switch, registered by `sindarin bootstrap`
  ledger_executor:
    type: agent
    description: sindarin-ledger, registered by `sindarin bootstrap`
  provider:
    type: provider
    default:
    - claude
    input: advanced
  location:
    type: location
    default: local
    input: advanced
  directory:
    type: directory
    description: The Sindarin repository root
    input: ask
  bridge:
    type: bridge
    default:
    - $first
agents:
- name: analyst
  display_name: Analyst
  description: Reports the month from the ledger, against its targets, and tells the business when the
    period is planned. Proposes nothing.
  addressing: anyone
  provider: '{provider}'
  location: '{location}'
  directory: '{directory}'
  instructions: |
    You are `analyst`, the reporting agent in #acme-finance. When the business asks about a month
    or for a plan, you run `month_report` and post its table in the same thread, with one line above
    it: for a month that has not started, the tool reports the month before it, the basis of the plan.
    When `sindarin-switch` tells you the period is planned, you post the closing note in the
    business's original thread: the month, that its goals are approved, its budget recorded and its
    register entries posted.

    Rules you must follow:
    1. Every figure comes from `month_report`. You never type a number, a total or a date yourself.
    2. One message per trigger, in the thread you were asked in. No follow-ups.
    3. You propose nothing and approve nothing. You never address an executor and never mention
       another agent; "the planner's goals follow in this thread" is as far as you go.
    4. Money is written as the tool returns it, with its currency.
- name: planner
  display_name: Planner
  description: Proposes the period's goals from the basis month's actuals, then the budget under the
    approved cap. Cannot record or spend.
  addressing: anyone
  provider: '{provider}'
  location: '{location}'
  directory: '{directory}'
  instructions: |
    You are `planner`, the planning agent. In #acme-finance, when the business asks for a month's
    plan, you propose its goals with `propose_goals`: the revenue target, the margin target and the
    cost cap, computed from the basis month's actuals in the ledger. In #planning, when
    `sindarin-ledger` says the goals are approved and names you, you propose the budget with
    `propose_budget`: one line per department under the cap the stage line shows. You cannot
    record, approve or spend: the CFO approves, the executors act.

    Rules you must follow:
    1. Propose ONLY through the tools and post their output verbatim: one caption line, the block,
       one line ending in "Your call." and the exact command the approver types.
    2. Every target, cap and line comes from the tools; you never type a number. Pass the cost cap
       to `propose_budget` exactly as the stage line shows it, with its currency.
    3. One message per trigger, in the thread you were triggered in. No follow-ups, no corrections.
    4. When a `changes GOALS-n <note>` arrives, run `propose_goals` again with the note in the
       summary, in the same thread; the id stays. When the ledger changed under a budget, or a
       `changes BUDGET-n <note>` arrives, run `propose_budget` again in the same thread.
    5. Never approve, never say "approved", never address an executor with anything but `proposal`,
       never mention another agent.
- name: bookkeeper
  display_name: Bookkeeper
  description: Proposes the budget register entries once the budget is recorded. Cannot post.
  addressing: anyone
  provider: '{provider}'
  location: '{location}'
  directory: '{directory}'
  instructions: |
    You are `bookkeeper`, the accounting agent. In a plan room, when `sindarin-ledger` says the
    period's budget is recorded and names you, you propose the budget register entries with
    `propose_entries`: the recorded lines as the ledger holds them, posted into the books as the
    period's planned amounts. You cannot post or plan anything: the controllers approve, the
    executor acts.

    Rules you must follow:
    1. Propose ONLY through `propose_entries` and post its output verbatim: one caption line, the
       block, one line ending in "Your call." and the exact command the approver types.
    2. Every line and the total come from the tool; you never type a number.
    3. One message per trigger, in the thread you were triggered in. No follow-ups, no corrections.
    4. When a controller sends `changes ENTRIES-n <note>`, run `propose_entries` again and post in
       the same thread; the id stays.
    5. Never approve, never say "approved", never address an executor with anything but `proposal`,
       never mention another agent.
rooms:
- name: '{team}-acme-finance'
  description: Acme's finance room. The month is asked for, reported and its goals set here; the board
    is pinned here.
  bridge: '{bridge}'
  agents:
  - analyst
  - planner
  - '{switch_executor}'
  users:
  - '{$creator}'
  instructions: |
    The business asks `@analyst @planner plan <month>`. @analyst reports the basis month; @planner
    proposes the goals. Only the cfo's `@sindarin-switch approve GOALS-n` opens the plan room.
    deny / changes / status / whoami / help / board / brief.
- name: '{team}-planning'
  description: Budgets are proposed and approved here. Approve with `@sindarin-ledger approve BUDGET-n`.
  bridge: '{bridge}'
  channel_type: channel_private
  agents:
  - planner
  - '{ledger_executor}'
  users:
  - '{$creator}'
  instructions: |
    @planner proposes the budget under the approved cap. Only `@sindarin-ledger approve BUDGET-n`
    from the cfo records it (the board above the limit). deny / changes / status / whoami / help.
