# sindarin-ledger (design v4 §5). Owns PAY-n and LOCK-n; the only process that writes ledger_db.
# Secrets live in the root .env, never here.
executor: sindarin-ledger
room_names:
  product: '#product'
  releases: '#releases'
  customer: '#acme-shared'
self_id: ''
peer_ids: []
policy_path: ../agents/policy/policy.yaml
users_path: ../agents/policy/users.yaml
state_db: ''
sweep_interval_seconds: 30
retry_minutes: 60
max_attempts: 2
thread_replies: true
post_audit_lines: false
status_fences: false
ledger_db: books.db
data_dir: ../data/acme
room_creation: gateway
addressing: rooms
bridge_id: ''
peer_state_db: switch.db
directory: {}
