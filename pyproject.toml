[project]
name = "sindarin"
version = "0.1.0"
description = "Agents propose, verified humans commit, deterministic code acts: a product-change workflow inside Switch rooms. Built for Flip the Switch."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "websockets>=13",
    "pyyaml>=6",
    "typer>=0.12",
    "anthropic>=2.3.0",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "gspread>=6.2.1",
]

[project.scripts]
sindarin = "sindarin.cli:app"
sindarin-exec = "sindarin.cli:exec_app"
sindarin-agent = "sindarin.cli:agent_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sindarin"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "validation"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "validation"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"validation/*" = ["E501"]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
